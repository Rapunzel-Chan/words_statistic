[project]
name = "wordsstatistic"
version = "0.1.0"
description = ""
authors = [
    {name = "RapunzelChan",email = "rapuncel.chan24@gmail.com"}
]
requires-python = ">=3.14 <4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "dependency-injector (>=4.48.3,<5.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pymorphy3 (>=2.0.6,<3.0.0)",
    "pymorphy3-dicts-ru (>=2.4.417150.4580142,<3.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = false
no_implicit_optional = true
warn_return_any = false
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119

[dependency-groups]
lint = [
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "types-openpyxl (>=3.1.5.20260316,<4.0.0.0)"
]
